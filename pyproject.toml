[project]
name = "bookmarks-api"
version = "0.1.0"
description = "Bookmarks API assessment service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.19.0,<1.20",
    "fastapi>=0.139.2,<0.140",
    "pydantic>=2.13.4,<2.14",
    "pydantic-settings>=2.14.2,<2.15",
    "sqlalchemy>=2.0.51,<2.1",
    "sqlmodel==0.0.39",
    "uvicorn[standard]>=0.51.0,<0.52",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.15.3,<7.16",
    "httpx==0.28.1",
    "mypy>=2.3.0,<2.4",
    "pytest>=9.1.1,<9.2",
    "ruff>=0.15.22,<0.16",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
